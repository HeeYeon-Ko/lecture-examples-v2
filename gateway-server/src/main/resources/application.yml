## 로컬에는 "금고 열쇠"만 남긴다 — 라우트/포트/관리 엔드포인트는 config-server 가 배달한다.
#spring:
#  application:
#    name: gateway-server   # config-server 에서 내 설정 파일(gateway-server.yml)을 찾는 열쇠
#  config:
#    # 부팅할 때 config-server 에서 설정을 "수입"해 온다.
#    import: optional:configserver:http://localhost:8888

spring:
  application:
    name: gateway-server

  cloud:
    gateway:
      server:
        webflux:
          # 모든 라우트 공통 필터: 응답에 "게이트웨이를 거쳤음" 도장을 찍는다 (routes 와 같은 깊이)
          default-filters:
            - AddResponseHeader=X-Passed-Through, gateway-server
          routes:
            - id: order-route
              uri: lb://order-service
              predicates:
                - Path=/orders/**

            # 라우트 2: 상품
            - id: product-route
              uri: lb://product-service
              predicates:
                - Path=/products/**

            # 라우트 3: 결제
            - id: payment-route
              uri: lb://payment-service
              predicates:
                - Path=/payments/**

            # 라우트 4: 장바구니 — /users/** 보다 구체적이므로 반드시 위에!
            - id: cart-route
              uri: lb://cart-service
              predicates:
                - Path=/users/*/cart/**

            # 라우트 5: 회원 — /users 로 시작하는 "나머지" 전부
            - id: user-route
              uri: lb://user-service
              predicates:
                - Path=/users/**

server:
  port: 8000

# 라우팅 테이블 확인용 액추에이터 엔드포인트
management:
  endpoint:            # (단수) 개별 엔드포인트의 설정
    gateway:
      access: read-only   # SCG 5.0 부터 gateway 엔드포인트는 기본 차단 — 조회 전용으로 연다
  endpoints:           # (복수) 엔드포인트 노출 설정
    web:
      exposure:
        include: gateway

# 전화번호부의 위치 — 게이트웨이도 여기서 명부 사본을 받아온다 (최상위 레벨에 추가)
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka   # defaultZone 은 맵의 키라서 camelCase 그대로 적는다!
